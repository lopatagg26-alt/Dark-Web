
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARK WEB</title>

    <style>
        body {
            background: #000;
            color: #00ff41;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 400px;
        }

        h1 {
            font-size: 45px;
            text-shadow: 0 0 15px #00ff41;
            letter-spacing: 5px;
        }

        input {
            background: #080808;
            border: 1px solid #00ff41;
            color: #00ff41;
            padding: 13px;
            width: 85%;
            margin-top: 20px;
            outline: none;
            font-family: monospace;
        }

        button {
            background: #00ff41;
            color: black;
            border: none;
            padding: 12px 30px;
            margin-top: 15px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #008f11;
        }

        #welcome {
            margin-top: 30px;
            font-size: 18px;
            text-shadow: 0 0 10px #00ff41;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>DARK WEB</h1>

        <p>Как тебя зовут?</p>

        <input type="text" id="username"
               placeholder="Введи своё имя">

        <br>

        <button onclick="welcome()">ВОЙТИ</button>

        <div id="welcome"></div>

    </div>

    <script>
        function welcome() {
            let name = document.getElementById("username").value;

            if (name.trim() === "") {
                alert("Введите своё имя!");
                return;
            }

            document.getElementById("welcome").innerText =
                "Добро пожаловать, " + name + ", в Dark Web!";
        }
    </script>

</body>
</html>
